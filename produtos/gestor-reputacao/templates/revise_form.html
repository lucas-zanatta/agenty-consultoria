<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solicitar modificações — Agenty</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    body { background: #faf7f2; color: #18130e; font-family: Inter, Arial, sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px }
    .card { background: #fff; border: 1px solid #e2dbd0; border-radius: 16px;
            padding: 48px; max-width: 520px; width: 100% }
    .logo { display: flex; align-items: center; gap: 8px;
            font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
            font-size: 26px; letter-spacing: .5px; text-transform: uppercase;
            color: #c94a1f; margin-bottom: 28px }
    .logo img { width: 28px; height: 28px }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
         font-size: 24px; margin-bottom: 12px }
    p { font-size: 14px; color: #8a7f74; line-height: 1.6; margin-bottom: 20px }
    .draft-box { background: #fff7f0; border: 1px solid #f2b705; border-radius: 8px;
                 padding: 16px; margin-bottom: 24px; font-style: italic;
                 font-size: 14px; color: #1e293b; line-height: 1.7 }
    label { display: block; font-size: 13px; font-weight: 600; color: #2e2520; margin-bottom: 8px }
    textarea { width: 100%; padding: 12px 14px; border: 1px solid #e2dbd0; border-radius: 8px;
               font-size: 14px; font-family: Inter, sans-serif; color: #18130e;
               background: #faf7f2; resize: vertical; min-height: 100px;
               outline: none; transition: border-color .15s; line-height: 1.6 }
    textarea:focus { border-color: #c94a1f }
    .hint { font-size: 12px; color: #8a7f74; margin-top: 6px; margin-bottom: 24px }
    button { width: 100%; padding: 14px; background: #c94a1f; color: #fff;
             border: none; border-radius: 8px;
             font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
             font-size: 18px; letter-spacing: .5px; text-transform: uppercase;
             cursor: pointer; transition: background .15s }
    button:hover { background: #a83210 }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/static/favicon.svg" alt="">Agenty</div>
    <h1>Solicitar modificações</h1>
    <p>Este é o rascunho atual gerado pela IA. Descreva abaixo o que você gostaria de mudar.</p>

    <div class="draft-box">"{{ draft }}"</div>

    <form method="POST" action="/revise/{{ token }}">
      <label for="feedback">O que você quer mudar?</label>
      <textarea id="feedback" name="feedback" required
        placeholder="Ex: Adicione um pedido de desculpas mais caloroso e mencione que entramos em contato pelo WhatsApp para resolver..."></textarea>
      <div class="hint">A IA vai reescrever a resposta com suas instruções e enviar uma nova versão por e-mail para aprovação.</div>
      <button type="submit">Enviar para a IA reescrever →</button>
    </form>
  </div>
</body>
</html>
