<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Selecionar localização — Agenty</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    body { background: #faf7f2; color: #18130e; font-family: Inter, Arial, sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px }
    .card { background: #fff; border: 1px solid #e2dbd0; border-radius: 16px;
            padding: 48px; max-width: 520px; width: 100% }
    .logo { display: flex; align-items: center; gap: 8px;
            font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
            font-size: 26px; letter-spacing: .5px; text-transform: uppercase;
            color: #c94a1f; margin-bottom: 28px }
    .logo img { width: 28px; height: 28px }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
         font-size: 26px; letter-spacing: .3px; margin-bottom: 8px }
    p.sub { font-size: 14px; color: #8a7f74; margin-bottom: 28px; line-height: 1.6 }
    .loc-option { display: block; border: 1px solid #e2dbd0; border-radius: 10px;
                  padding: 16px 20px; margin-bottom: 12px; cursor: pointer;
                  transition: border-color .15s, background .15s }
    .loc-option:hover { border-color: #c94a1f; background: #fff7f5 }
    .loc-option input[type=radio] { display: none }
    .loc-option.selected { border-color: #c94a1f; background: #fff7f5 }
    .loc-name { font-weight: 600; font-size: 15px }
    .loc-id { font-size: 12px; color: #8a7f74; margin-top: 2px }
    button { width: 100%; margin-top: 24px; padding: 14px;
             background: #c94a1f; color: #fff; border: none; border-radius: 8px;
             font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
             font-size: 18px; letter-spacing: .5px; text-transform: uppercase;
             cursor: pointer; transition: background .15s }
    button:hover { background: #a83210 }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/static/favicon.svg" alt="">Agenty</div>
    <h1>Qual é o seu estabelecimento?</h1>
    <p class="sub">Encontramos mais de um local vinculado à sua conta. Selecione qual deve ser monitorado.</p>

    <form method="POST" action="/onboarding/{{ token }}/location" id="form">
      {% for account_name, loc in locations %}
      <label class="loc-option">
        <input type="radio" name="location_name" value="{{ loc.name }}" required>
        <input type="hidden" name="account_name" value="{{ account_name }}">
        <div class="loc-name">{{ loc.title }}</div>
        <div class="loc-id">{{ loc.name }}</div>
      </label>
      {% endfor %}

      <button type="submit">Confirmar e ativar automação →</button>
    </form>
  </div>
  <script>
    document.querySelectorAll('.loc-option').forEach(label => {
      label.addEventListener('click', () => {
        document.querySelectorAll('.loc-option').forEach(l => l.classList.remove('selected'));
        label.classList.add('selected');
      });
    });
  </script>
</body>
</html>
