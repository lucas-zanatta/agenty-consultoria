<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nova versão enviada — Agenty</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    body { background: #faf7f2; color: #18130e; font-family: Inter, Arial, sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px }
    .card { background: #fff; border: 1px solid #e2dbd0; border-radius: 16px;
            padding: 48px; max-width: 480px; width: 100%; text-align: center }
    .logo { display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
            font-size: 26px; letter-spacing: .5px; text-transform: uppercase;
            color: #c94a1f; margin-bottom: 32px }
    .logo img { width: 28px; height: 28px }
    .icon { font-size: 48px; margin-bottom: 20px }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
         font-size: 26px; margin-bottom: 12px }
    p { font-size: 14px; color: #8a7f74; line-height: 1.7; margin-bottom: 16px }
    .draft-box { background: #fff7f0; border: 1px solid #f2b705; border-radius: 8px;
                 padding: 16px; text-align: left; font-style: italic;
                 font-size: 14px; color: #1e293b; line-height: 1.7; margin: 20px 0 }
    a { color: #c94a1f; text-decoration: none; font-size: 13px }
    a:hover { text-decoration: underline }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/static/favicon.svg" alt="">Agenty</div>
    <div class="icon">✉️</div>
    <h1>Nova versão enviada!</h1>
    <p>A IA reescreveu a resposta com suas instruções. Verifique seu e-mail para aprovar ou solicitar mais ajustes.</p>
    <div class="draft-box">"{{ draft }}"</div>
    <p style="font-size:12px"><a href="https://agenty.com.br">agenty.com.br</a></p>
  </div>
</body>
</html>
