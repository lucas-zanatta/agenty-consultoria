<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Configure sua automação — Agenty</title>
  <link rel="icon" type="image/svg+xml" href="https://agenty.com.br/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    body { background: #faf7f2; color: #18130e; font-family: Inter, Arial, sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px }
    .card { background: #fff; border: 1px solid #e2dbd0; border-radius: 16px;
            padding: 48px; max-width: 520px; width: 100% }
    .logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
            font-size: 26px; letter-spacing: .5px; text-transform: uppercase;
            color: #c94a1f; margin-bottom: 8px }
    .step { font-size: 12px; color: #8a7f74; margin-bottom: 28px; font-weight: 500 }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
         font-size: 28px; letter-spacing: .3px; margin-bottom: 8px; color: #18130e }
    p.sub { font-size: 14px; color: #8a7f74; margin-bottom: 32px; line-height: 1.6 }
    label { display: block; font-size: 13px; font-weight: 600; color: #2e2520;
            margin-bottom: 6px; margin-top: 20px }
    label:first-of-type { margin-top: 0 }
    input, select { width: 100%; padding: 12px 14px; border: 1px solid #e2dbd0;
                    border-radius: 8px; font-size: 14px; font-family: Inter, sans-serif;
                    color: #18130e; background: #faf7f2; outline: none; transition: border-color .15s }
    input:focus, select:focus { border-color: #c94a1f }
    .hint { font-size: 12px; color: #8a7f74; margin-top: 4px }
    button { width: 100%; margin-top: 32px; padding: 14px;
             background: #c94a1f; color: #fff; border: none; border-radius: 8px;
             font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
             font-size: 18px; letter-spacing: .5px; text-transform: uppercase;
             cursor: pointer; transition: background .15s }
    button:hover { background: #a83210 }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Agenty</div>
    <div class="step">Passo 1 de 2 — Informações do negócio</div>
    <h1>Configure sua automação</h1>
    <p class="sub">Essas informações definem como a IA vai responder as avaliações do seu negócio.</p>

    <form method="POST" action="/onboarding/{{ token }}/setup">
      <label for="business_name">Nome do negócio</label>
      <input id="business_name" name="business_name" type="text" required
             placeholder="Ex: Salão da Maria" value="{{ client.business_name or '' }}">

      <label for="business_type">Tipo de negócio</label>
      <input id="business_type" name="business_type" type="text" required
             placeholder="Ex: salão de beleza, restaurante, barbearia"
             value="{{ client.business_type or '' }}">

      <label for="business_city">Cidade</label>
      <input id="business_city" name="business_city" type="text"
             value="{{ client.business_city or 'Curitiba' }}">

      <label for="tone">Tom de voz das respostas</label>
      <select id="tone" name="tone">
        <option value="proximo_descontraido" {% if (client.tone or 'proximo_descontraido') == 'proximo_descontraido' %}selected{% endif %}>
          Próximo e descontraído — como quem conhece os clientes
        </option>
        <option value="profissional_cordial" {% if client.tone == 'profissional_cordial' %}selected{% endif %}>
          Profissional e cordial — gerente atencioso
        </option>
        <option value="formal" {% if client.tone == 'formal' %}selected{% endif %}>
          Formal — empresa tradicional e séria
        </option>
      </select>

      <label for="approval_email">E-mail para receber avaliações negativas</label>
      <input id="approval_email" name="approval_email" type="email" required
             placeholder="seu@email.com" value="{{ client.approval_email or client.email or '' }}">
      <div class="hint">Avaliações abaixo de 4 estrelas serão enviadas para aprovação antes de publicar.</div>

      <label for="auto_reply_min_rating">Responder automaticamente a partir de</label>
      <select id="auto_reply_min_rating" name="auto_reply_min_rating">
        <option value="4" {% if (client.auto_reply_min_rating or 4) == 4 %}selected{% endif %}>4 estrelas (recomendado)</option>
        <option value="5" {% if client.auto_reply_min_rating == 5 %}selected{% endif %}>5 estrelas</option>
        <option value="3" {% if client.auto_reply_min_rating == 3 %}selected{% endif %}>3 estrelas</option>
      </select>

      <button type="submit">Continuar para conectar o Google →</button>
    </form>
  </div>
</body>
</html>
